<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calendar</title>
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
        <link rel="stylesheet" type="text/css" href="ECreation.css">
    </head>
    <body>
        <div class="calendar">
            <!--Molly added div month-container while trying to increase space per calendar cell-->
            <div class="month-containerCalendar">
                <button id="previous-month">
                    <span class="material-icons">chevron_left</span>
                </button>
                <div id="month-year"></div>
                <button id="next-month">
                    <span class="material-icons">chevron_right</span>
                </button>
            </div>
        <div class="weekdays">
          <div title="Sunday">Sun</div>
          <div title="Monday">Mon</div>
          <div title="Tuesday">Tue</div>
          <div title="Wednesday">Wed</div>
          <div title="Thursday">Thu</div>
          <div title="Friday">Fri</div>
          <div title="Saturday">Sat</div>
        </div>
        <div id="days"></div>
      </div>
      <script src="CalScript.js"></script>
    </body>
</html>
