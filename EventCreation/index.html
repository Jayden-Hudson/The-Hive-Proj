<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Event Creation</title>
     <link rel="stylesheet" type="text/css" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>


<div class="list">
<h2>Current Event List</h2>
  <button id="refreshBtn" type="button">Refresh List</button>
  <ul id="eventList"></ul>
</div>


    <div class="form">
        <fieldset>
            <legend>Create a New Event</legend>
            <form>

        <label for="eventName">Event Name<span>*</span></label>
        <input type="text" id="eventName" placeholder="Enter the name of the event" required >

        <label for="eventType">Event Type<span>*</span></label>
       <input type="text" id="eventType" placeholder="Enter the type of the event" required>

        <label for="eventPerformers">Performer(s)<span>*</span></label>
        <input type="text" id="eventPerformers" placeholder="Enter the name(s) of the performer(s)" required>

        <label for="eventDate">Date<span>*</span></label>
      <input type="text" id="eventDate" placeholder="Enter the date of the event (YYYY-MM-DD)" required>
      

        <label for="eventTime">Event Time<span>*</span></label>
        <input type="text" id="eventTime" placeholder="Enter the time of the event" required />

        <label for="eventAges">Age Range<span>*</span></label>
     <input type="text" id="eventAges" placeholder="Enter the age range for the event" required>


        <button type="submit">Add Event</button>
    </form>
    </fieldset>
    
</div>

    <div class="calendar">

    <div id="month-year"></div>

    <button id="previous-month">
      <span class="material-icons">chevron_left</span>
    </button>

    <button id="next-month">
      <span class="material-icons">chevron_right</span>
    </button>

    <div class="weekdays">
      <div title="Sunday">Sun</div>
      <div title="Monday">Mon</div>
      <div title="Tuesday">Tue</div>
      <div title="Wednesday">Wed</div>
      <div title="Thursday">Thu</div>
      <div title="Friday">Fri</div>
      <div title="Saturday">Sat</div>
    </div>

    <div id="days"></div>

  </div>
  </div>


    <script src="script.js"></script>
</body>

</html>
