<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">

</head>

<body>

    <header>
        <h1>Golden Field</h1>
        <nav class="navigation">

            <a href="dashboard.html">Home</a>
            <a href="employee.html">New Employee</a>
            <a href="ECreation.html">Create Event</a>
            <!--
            <a href="eventRequest.html">Event Request</a>
            -->

            <a href="#" id="drawer">Reports</a>
        </nav>
    </header>



    <!-- Ticket Reports -->
    <div id="overlay"></div>
    <div class="drawer" id="reportDrawer">
        <h2>Reports</h2>
        <p>Total Tickets Sold:0 <span id="ticketsSold"></span></p>
        <p>Tickets Available:255 <span id="ticketsAvailable"></span></p>

    </div>


    // tickets total table
    // select from tablet
   //

    <!-- Event request list will be shown here -->
    <div id="eventrequestList"></div>

</body>

<script>
    fetch("http://localhost:8080/api/dashboard/eventrequests")
   .then(res => res.json())
   .then(data => {

       let html = '';
       data.forEach(item => {
           html += `
           <div class="request-card">
               <h2>${item.eventtype}</h2>
               <p><span class="label">Performer:</span> ${item.performers}</p>
               <p><span class="label">Attendance:</span> ${item.expectedattendance}</p>
               <p><span class="label">Age Range:</span> ${item.agerange}</p>
               <p><span class="label">Budget:</span> ${item.eventbudget}</p>
               <p><span class="label">Start Time:</span> ${item.starttime}</p>
               <p><span class="label">Start Date:</span> ${item.startdate}</p>
               <p><span class="label">Details:</span> ${item.additionaleventdetails}</p>
           </div>
           `;
       });

       document.getElementById("eventrequestList").innerHTML = html;

   })
   .catch(error => console.log(error));



//overlay
           const drawerBtn = document.getElementById("drawer");
           const drawer = document.getElementById("reportDrawer");
           const overlay = document.getElementById("overlay");

           drawerBtn.addEventListener("click", function (e) {
               e.preventDefault();
               drawer.classList.add("open");
               overlay.classList.add("active");
           });
           overlay.addEventListener("click", function () {
               drawer.classList.remove("open");
               overlay.classList.remove("active");
           });

</script>

</html>
