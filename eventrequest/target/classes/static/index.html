<!DOCTYPE html>
<html>
    <head>
        <title></title>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body>
        <div>
            <h1>Booking Request Form</h1>
            <form id="form">
                <fieldset>
                    <legend>Event Information</legend>
                    <p class="requiredField">Indicates a Required Field *</p>
                    <label for="eventType">Event Type<span>*</span></label>
                    <select id="eventType" required>
                        <option value="" hidden>Select event type...</option>
                        <option value="live concert">Live concert</option>
                        <option value="theater">Theater</option>
                        <option value="public ticketed concert">Public ticketed concert</option>
                        <option value="private party">Private party</option>
                        <option value="other">Other</option>
                        <!--Other options to be added-->
                        <option>...</option>
                        <option>...</option>
                        <option>...</option>
                    </select>
                    <label for="performers">Special Performer(s)<span>*</span></label>
                    <input type="text" id="performers" required>
                    <label for="startDate">Start Date<span>*</span></label>
                    <input type="date" id="startDate" required>
                    <label for="startTime">Desired Start Time<span>*</span></label>
                    <select id="startTime">
                        <option value="" hidden>Select a start time...</option>
                        <option value="12">12:00 PM</option>
                        <option value="1">1:00 PM</option>
                        <option value="2">2:00 PM</option>
                        <option value="3">3:00 PM</option>
                        <option value="4">4:00 PM</option>
                        <option value="5">5:00 PM</option>
                        <option value="6">6:00 PM</option>
                        <option value="7">7:00 PM</option>
                        <option value="8">8:00 PM</option>
                        <option value="9">9:00 PM</option>
                    </select>
                    <label for="attendance">Expected Attendance<span>*</span></label>
                    <input type="text" id="attendance" required>
                    <label for="ages">Attendee Age Range<span>*</span></label>
                    <select id="ages" required>
                        <option value="" hidden>Select an age range...</option>
                        <option value="21+">21+</option>
                        <option value="18+">18+</option>
                        <option value="16+">16+</option>
                        <option value="all ages">All ages</option>
                        <option value="other">Other</option>
                    </select>
                    <label for="otherLabel" class="hidden">Please specify 'Other' age selection<span>*</span></label>
                    <input type="text" id="otherLabel" class="hidden">
                    <label for="budget">Event Budget<span>*</span></label>
                    <input  type="text" id="budget" required>

                    <label for="eventDetails">Additional Event Details</label>
                    <textArea id="eventDetails"></textArea>
                </fieldset>
                <fieldset>
                    <legend>Contact Information</legend>
                    <label for="company">Promoter/Event Planner Company Name<span>*</span></label>
                    <input type="text" id="company" required>
                    <label for="firstName">Contact Person<span>*</span></label>
                    <input type="text" id="firstName" required placeholder="First Name...">
                    <input type="text" id="lastName" placeholder="Last name..." required>
                    <label for="phone">Phone<span>*</span></label>
                    <input type="text" id="phone" required>
                    <label for="email">Email<span>*</span></label>
                    <input type="text" id="email" required>
                    <label id="emailMessage" class="invalidLabel"></label>
                    <label for="contactTime">Best Time to be Reached</label>
                    <select id="contactTime">
                        <option value="" hidden>Select a time...</option>
                        <option value="morning">8:00 AM - Noon</option>
                        <option value="afternoon">Noon - 4:00 PM</option>
                        <option value="evening">4:00 PM - 8:00 PM</option>
                    </select>
                    <label for="links">Company Website or Social Media Links</label>
                    <input type="text" id="links">
                    <label for="contactNotes">Additional Notes</label>
                    <textarea id="contactNotes"> </textarea>
                </fieldset>
                <input type="submit" id="submitButton">
            </form>
        </div>
        <script>

            //Elements by Id
            //Fieldset 1
            const form = document.getElementById('form');
            const eventType = document.getElementById('eventType');
            const performers = document.getElementById('performers');
            const startDate = document.getElementById('startDate');
            const startTime = document.getElementById('startTime');
            const attendance = document.getElementById('attendance');
            const ages = document.getElementById('ages');
            const otherLabel = document.getElementById('otherLabel');
            const budget = document.getElementById('budget');
            const eventDetails = document.getElementById('eventDetails');

            //Fieldset 2
            const company = document.getElementById('company');
            const firstName = document.getElementById('firstName');
            const lastName = document.getElementById('lastName');
            const phone = document.getElementById('phone');
            const email = document.getElementById('email');
            const emailMessage = document.getElementById('emailMessage');
            const contactTime = document.getElementById('contactTime');
            const links = document.getElementById('links');
            const contactNotes = document.getElementById('contactNotes');

            //Elements by class
            const classHidden = document.getElementsByClassName('hidden');

            // const responseMessage = document.getElementById('responseMessage');


            //Display input in user selects "Other"
            ages.addEventListener('change', () => {
                if (ages.value === 'other') {
                    for (let elm of classHidden) {
                        elm.style.display = 'inline';
                    }
                }
                else {
                    for (let elm of classHidden) {
                        elm.style.display = 'none';
                    }
                }
            });


            //Display alert if email address is invalid
            email.addEventListener('change', () => {
                const emailValue = email.value;
                if (/^[^@]+@[^@]+\.[^@]+$/.test(emailValue)) {
                    emailMessage.style.display = 'none';
                } else {
                    emailMessage.style.display = 'block';
                    emailMessage.textContent = "Please enter a valid email address";
                }
            });


            //Prevent user from being able to select a date that has already occurred in real time
            startDate.addEventListener('click', minDate);
            function minDate() {
                const today = new Date();
                const mm = String(today.getMonth() + 1).padStart(2,'0');
                const dd = String(today.getDate() + 1).padStart(2,'0');
                const yyyy = today.getFullYear();

                const todayString = `${yyyy}-${mm}-${dd}`;
                startDate.min = todayString;
            }

            form.addEventListener('submit', function(event) {
                event.preventDefault(); //Prevent default form submission

                const eventData = {
                    eventType: eventType.value,
                    performers: performers.value,
                    startDate: startDate.value,
                    startTime: startTime.value,
                    attendance: attendance.value,
                    ages: ages.value,
                    otherLabel: otherLabel.value,
                    budget: budget.value,
                    eventDetails: eventDetails.value,
                    company: company.value,
                    firstName: firstName.value,
                    lastName: lastName.value,
                    phone: phone.value,
                    email: email.value,
                    contactTime: contactTime.value,
                    links: links.value,
                    contactNotes: contactNotes.value
                }

                console.log(eventData);

/*                const contactData = {
                    company: company.value,
                    firstName: firstName.value,
                    lastName: lastName.value,
                    phone: phone.value,
                    email: email.value,
                    contactTime: contactTime.value,
                    links: links.value,
                    contactNotes: contactNotes.value
                }
*/

                //Send event data
                fetch('http://localhost:8080/api/eventrequest', {  //Replace these :8080/as/needed
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(eventData),
                }).then(response => response.text())
                        .then(data => alert(data))
                        .catch(error => console.error('Error:', error));

/*
                //Send contact data
                fetch('http://localhost:8080/api/eventrequest', {  //Replace these :8080/as/needed
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(contactData),
                }).then(response => response.text())
                        .then(data => alert(data))
                        .catch(error => console.error('Error:', error));
*/

            });

        </script>

      <!-- <script src="script.js"></script> -->
    </body>
</html>
