<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Event Creation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
            line-height: 1.5;
        }

        h1 {
            margin-bottom: 0.5rem;
        }

        .muted {
            color: #666;
            font-size: 0.9rem;
        }

        #message {
            font-weight: bold;
            margin: 0.75rem 0;
        }

        .ok {
            color: #1a7f37;
        }

        .error {
            color: #b00020;
        }

        form {
            margin: 1rem 0;
            display: grid;
            gap: 0.5rem;
            max-width: 480px;
        }

        input[type=text],
        input[type=number] {
            padding: 0.5rem;
            width: 100%;
        }

        button {
            padding: 0.4rem 0.8rem;
        }

        ul {
            padding-left: 1.2rem;
        }

        li {
            margin-bottom: 0.25rem;
        }
    </style>
</head>

<body>
    <h1>Event Creation</h1>

    <p id="message"></p>

    <h2>Current Events</h2>
    <button id="refreshBtn" type="button">Refresh List</button>
    <ul id="eventList"></ul>

    <h2>Add New Event</h2>

    <form id="addForm" novalidate>
        <label>
            Event Name
            <input type="text" id="eventName" placeholder="Enter the name of your event" required />
        </label>
        <label>
            Performer(s)
            <input type="text" id="performers" placeholder="Enter the name(s) of the performer(s)" />
        </label>
        <label>
            Event Date
            <input type="text" id="eventDate" placeholder="Enter the date of the event" required />
        </label>
        <label>
            Event Time
            <input type="text" id="eventTime" placeholder="Enter the time of the event" required />
        </label>
        <button type="submit">Add Event</button>
    </form>

    <script src="script.js"></script>
</body>

</html>
