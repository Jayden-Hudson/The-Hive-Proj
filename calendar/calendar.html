<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .calendar {
      width: 40%;
      height: 100vh;
    }

    .weekdays,
    #days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }

    .weekdays {
      margin-bottom: 30px;
    }

    #days div.selected {
      background: #491ceb;
      color: white;
    }
  </style>
</head>

<body>
  <div class="calendar">

    <div id="month-year"></div>

    <button id="previous-month">
      <span class="material-icons">chevron_left</span>
    </button>

    <button id="next-month">
      <span class="material-icons">chevron_right</span>
    </button>

    <div class="weekdays">
      <div title="Sunday">Sun</div>
      <div title="Monday">Mon</div>
      <div title="Tuesday">Tue</div>
      <div title="Wednesday">Wed</div>
      <div title="Thursday">Thu</div>
      <div title="Friday">Fri</div>
      <div title="Saturday">Sat</div>
    </div>

    <div id="days"></div>

  </div>
  </div>

  <script src="calendar-Script.js"></script>
</body>

</html>
