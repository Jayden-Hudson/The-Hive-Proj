<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Employee</title>
    <link rel="stylesheet" href="account.css">
</head>
<body>

<h1>New Employee</h1>

<form id="employeeForm">

    <label for="firstname">First Name</label><br>
    <input id="firstname" name="firstname" placeholder="First Name" required><br>

    <label for="lastname">Last Name</label><br>
    <input id="lastname" name="lastname" placeholder="Last Name" required><br>

    <label for="dateOfBirth">Date of Birth</label><br>
    <input type="date" id="dateOfBirth" name="dateOfBirth" required><br>

    <label for="address">Address</label><br>
    <input id="address" name="address" placeholder="Address" required><br>

    <label for="zipcode">Zip Code</label><br>
    <input id="zipcode" name="zipcode" placeholder="Zip Code" required><br>

    <label for="city">City</label><br>
    <input id="city" name="city" placeholder="City" required><br>

    <label for="state">State</label><br>
    <input id="state" name="state" placeholder="State" required><br>

    <label for="salary">Salary</label><br>
    <input id="salary" name="salary" placeholder="Salary" type="number" required><br>

    <label for="wagerate">Wage Rate</label><br>
    <input id="wagerate" name="wagerate" placeholder="Wage Rate" type="number" step="0.01" required><br>

    <label for="hiredate">Hire Date</label><br>
    <input type="date" id="hiredate" name="hiredate" required><br>

    <label for="releaseddate">Released Date</label><br>
    <input type="date" id="releaseddate" name="releaseddate"><br>

    <label for="password">Password</label><br>
    <input id="password" type="password" name="password" placeholder="Password" required><br><br>

    <div class="btn-field">
        <button type="button" id="Create">Create</button>
    </div>

</form>

<script src="signup.js"></script>
</body>
</html>
